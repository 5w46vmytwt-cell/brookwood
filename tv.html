<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brookwood — The Final Session</title><style>
:root{--bg:#080808;--panel:#111;--line:#2b2b2b;--ink:#eee;--muted:#8d8d8d;--blood:#9f1717}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#1a1515 0,#080808 48%,#020202 100%);color:var(--ink);font-family:Georgia,serif;min-height:100vh}.wrap{max-width:1500px;margin:auto;padding:4vh 4vw}.eyebrow{letter-spacing:.34em;text-transform:uppercase;color:#999;font:12px Arial,sans-serif}.top{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid #333;padding-bottom:18px}.title{font-size:clamp(34px,5vw,74px);margin:5px 0 0;letter-spacing:.04em}.room{text-align:right;font:14px Arial,sans-serif;color:#aaa}.room b{display:block;font-size:34px;color:white;letter-spacing:.18em}.join{display:flex;justify-content:space-between;gap:25px;align-items:center;margin:22px 0}.qr{background:#fff;padding:10px;width:190px;height:190px;flex-shrink:0}.joinUrl{font:18px Arial,sans-serif;color:#ddd}.count{font:14px Arial,sans-serif;color:#aaa}.count strong{font-size:30px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{min-height:110px;border:1px solid var(--line);background:linear-gradient(180deg,#121212,#0c0c0c);padding:15px;position:relative}.num{font:11px Arial,sans-serif;color:#555}.name{font-size:23px;margin-top:9px}.partner{font:12px Arial,sans-serif;color:#888;margin-top:7px}.ready{position:absolute;right:12px;top:12px;font:10px Arial,sans-serif;letter-spacing:.16em;color:#777}.ready.y{color:#d4d4d4}.empty{color:#444}.host{margin-top:22px;border-top:1px solid #222;padding-top:15px;display:flex;gap:8px;justify-content:flex-end;font-family:Arial,sans-serif}.host input,.host button{background:#0d0d0d;color:#ddd;border:1px solid #333;padding:10px 12px}.host button{cursor:pointer}.host .start{border-color:#662020}.msg{font:12px Arial,sans-serif;color:#a66;text-align:right;margin-top:8px}.opening{display:none;position:fixed;inset:0;background:#030303;color:#eee;align-items:center;justify-content:center;text-align:center;padding:30px}.opening.show{display:flex}.opening .date{font:13px Arial,sans-serif;letter-spacing:.5em;color:#777}.opening h1{font-size:clamp(48px,8vw,110px);margin:25px 0 8px}.opening h2{font-size:clamp(25px,4vw,50px);font-weight:normal;margin:0;color:#aaa}.opening p{font:16px Arial,sans-serif;color:#777;margin-top:40px;letter-spacing:.08em}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Brookwood Farm · October 31</div><h1 class="title">THE FINAL SESSION</h1></div><div class="room">ROOM CODE<b>1031</b></div></div><div class="join"><div><div class="eyebrow">Join on your phone</div><div class="joinUrl" id="joinUrl"></div></div><div id="qr" class="qr" role="img" aria-label="Scan to open the Brookwood player join page"></div><div class="count"><strong id="count">0</strong> / 12 connected</div></div><section class="grid" id="grid"></section><div class="host"><input id="code" type="password" placeholder="Host code"><button class="start" onclick="host('start')">START FINAL SESSION</button><button onclick="host('test-fill')">TEST: FILL LOBBY</button><button onclick="host('reset')">RESET LOBBY</button></div><div id="msg" class="msg"></div></main><section id="opening" class="opening"><div><div class="date">OCTOBER 31 · 1998</div><h1>BROOKWOOD</h1><h2>The Final Session</h2><p>Some stories refuse to stay buried.</p></div></section><script src="/client.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const join=location.origin+'/join';document.getElementById('joinUrl').textContent=join;
try{if(typeof QRCode!=='function')throw new Error('QR library unavailable');new QRCode(document.getElementById('qr'),{text:join,width:170,height:170,correctLevel:QRCode.CorrectLevel.M})}catch{document.getElementById('qr').hidden=true}
let last=null,pollError=null;
function render(s){last=s;if(s.phase==='opening'){document.getElementById('opening').classList.add('show');return}document.getElementById('opening').classList.remove('show');document.getElementById('count').textContent=s.players.length;const byId=Object.fromEntries(s.players.map(p=>[p.id,p]));const g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<12;i++){const p=s.players[i],d=document.createElement('div');d.className='card';if(p){const partner=byId[p.partnerId];d.innerHTML=`<div class="num">CAST ${String(i+1).padStart(2,'0')}</div><div class="ready ${p.ready?'y':''}">${p.ready?'READY':'WAITING'}</div><div class="name"></div><div class="partner">${partner?'PARTNER · '+esc(partner.name):'PARTNER · —'}</div>`;d.querySelector('.name').textContent=p.name}else d.innerHTML=`<div class="num">CAST ${String(i+1).padStart(2,'0')}</div><div class="name empty">Awaiting player…</div>`;g.appendChild(d)}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function poll(){
  const msg=document.getElementById('msg');
  try{render(await lobbyRequest('/api/state'));if(pollError&&msg.textContent===pollError)msg.textContent='';pollError=null}
  catch(error){pollError=error.message;msg.textContent=pollError}
  finally{setTimeout(poll,1200)}
}
async function host(action){
  const msg=document.getElementById('msg');if(action==='reset'&&!confirm('Reset the entire Brookwood lobby?'))return;if(action==='test-fill'&&!confirm('Add 10 ready test players in 5 couples? Exactly 2 real players must be in the lobby.'))return;msg.textContent='';
  try{await lobbyRequest('/api/host',{action,code:document.getElementById('code').value})}
  catch(error){msg.textContent=error.message}
}poll();
</script></body></html>
