<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brookwood</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif;min-height:100vh}.shell{max-width:480px;margin:auto;padding:34px 22px 60px}.brand{font-family:Georgia,serif;font-size:40px;letter-spacing:.06em}.sub{font-size:11px;letter-spacing:.3em;color:#777;margin-top:5px}.panel{border-top:1px solid #292929;margin-top:28px;padding-top:25px}label{font-size:11px;letter-spacing:.18em;color:#888}input,select,button{width:100%;padding:15px;margin-top:9px;background:#0d0d0d;border:1px solid #333;color:#eee;font-size:16px;border-radius:0}button{cursor:pointer}button.primary{border-color:#6d2020;background:#140909}.error{color:#b86b6b;font-size:13px;margin-top:12px}.hidden{display:none}.statusTop{display:flex;justify-content:space-between;align-items:start}.alive{font-size:11px;letter-spacing:.25em}.hearts{font-size:22px;letter-spacing:.12em}.name{font-family:Georgia,serif;font-size:36px;margin:7px 0 25px}.row{border-top:1px solid #222;padding:15px 0}.row span{display:block;color:#777;font-size:10px;letter-spacing:.18em}.row b{display:block;margin-top:6px;font-weight:normal}.readyState{text-align:center;margin:20px 0;color:#777;font-size:12px;letter-spacing:.15em}.readyState.y{color:#eee}.opening{display:none;position:fixed;inset:0;background:#020202;align-items:center;justify-content:center;text-align:center;padding:25px}.opening.show{display:flex}.opening .small{font-size:11px;letter-spacing:.35em;color:#777}.opening h1{font-family:Georgia,serif;font-size:45px;margin:20px 0 6px}.opening h2{font-family:Georgia,serif;font-weight:normal;color:#aaa;margin:0}.opening p{margin-top:40px;color:#888;line-height:1.8}.warning{color:#666;font-size:12px;margin-top:28px}</style></head><body><main class="shell"><div class="brand">BROOKWOOD</div><div class="sub">THE FINAL SESSION · ROOM 1031</div><section id="joinBox" class="panel"><label>ENTER YOUR NAME</label><input id="name" maxlength="24" autocomplete="name" placeholder="Your name"><button class="primary" onclick="joinGame()">ENTER THE SESSION</button><div id="joinErr" class="error"></div></section><section id="playerBox" class="panel hidden"><div class="statusTop"><div class="alive">ALIVE</div><div class="hearts">♥ ♥ ♥</div></div><div id="playerName" class="name"></div><div class="row"><span>PARTNER</span><b id="partnerName">Not selected</b></div><div id="partnerControls"><label>CHOOSE YOUR PARTNER</label><select id="partner"></select><button onclick="choosePartner()">CONFIRM PARTNER</button></div><div class="row"><span>INVENTORY</span><b id="inventory">Empty</b></div><div id="readyState" class="readyState">NOT READY</div><button id="readyBtn" class="primary" onclick="toggleReady()">I'M READY</button><div id="playerErr" class="error"></div><div class="warning">Keep this phone with you. You will need it later.</div></section></main><section id="opening" class="opening"><div><div class="small">BROOKWOOD FARM</div><h1>THE FINAL SESSION</h1><h2>The session has begun.</h2><p>Keep your phone with you.<br>Do not refresh. Do not leave.</p></div></section><script src="/client.js"></script><script>
const KEY='brookwood-player-v3';let auth=null,me=null,pollTimer=null,polling=false,joining=false;
try{auth=JSON.parse(localStorage.getItem(KEY)||'null');if(auth&&(!auth.id||!auth.token))auth=null}catch{auth=null}
function clearSession(){try{localStorage.removeItem(KEY)}catch{}auth=null;me=null;show('join')}
function show(which){if(which==='join')document.getElementById('opening').classList.remove('show');document.getElementById('joinBox').classList.toggle('hidden',which!=='join');document.getElementById('playerBox').classList.toggle('hidden',which!=='player')}
async function joinGame(){
  if(joining)return;joining=true;const e=document.getElementById('joinErr');e.textContent='';
  try{const j=await lobbyRequest('/api/join',{name:document.getElementById('name').value});auth=j.player;try{localStorage.setItem(KEY,JSON.stringify(auth))}catch{}show('player');pollMe()}
  catch(error){e.textContent=error.message}finally{joining=false}
}
function render(j){me=j;document.getElementById('opening').classList.toggle('show',j.phase==='opening');document.getElementById('playerName').textContent=j.player.name;document.getElementById('partnerName').textContent=j.player.partner||'Not selected';document.getElementById('inventory').textContent=j.player.inventory.length?j.player.inventory.join(', '):'Empty';const rs=document.getElementById('readyState');rs.textContent=j.player.ready?'READY FOR THE FINAL SESSION':'NOT READY';rs.classList.toggle('y',j.player.ready);document.getElementById('readyBtn').textContent=j.player.ready?'I’M NOT READY':'I’M READY';document.getElementById('partnerControls').classList.toggle('hidden',!!j.player.partnerId);const sel=document.getElementById('partner');const old=sel.value;sel.innerHTML='<option value="">Select…</option>'+j.others.filter(x=>!x.partnerId||x.partnerId===j.player.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if([...sel.options].some(o=>o.value===old))sel.value=old}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function pollMe(){
  if(polling)return;
  clearTimeout(pollTimer);pollTimer=null;polling=true;
  const session=auth;
  try{
    if(!session){show('join');return}
    const j=await lobbyRequest('/api/me',session);
    if(auth===session){render(j);document.getElementById('playerErr').textContent=''}
  }catch(error){
    if(auth===session){if(error.status===401)clearSession();else document.getElementById('playerErr').textContent=error.message}
  }finally{polling=false;pollTimer=setTimeout(pollMe,1400)}
}
async function action(body){
  const e=document.getElementById('playerErr');e.textContent='';
  try{await lobbyRequest('/api/player',{...auth,...body});pollMe()}
  catch(error){if(error.status===401)clearSession();else e.textContent=error.message}
}
function choosePartner(){const id=document.getElementById('partner').value;if(id)action({action:'partner',partnerId:id})}function toggleReady(){if(me)action({action:'ready',ready:!me.player.ready})}document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();joinGame()}});show(auth?'player':'join');pollMe();
</script></body></html>
